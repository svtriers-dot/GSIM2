name: E2E smoke (Playwright)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-root-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://gsim:ci-only@127.0.0.1:5432/gsim_ci
      JWT_SECRET: synthetic-ci-only-not-a-production-key
      PORT: "5000"
      PG_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=critical
      - name: Deployment rollback tests
        run: python3 deploy/test_activate_release.py
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Prepare disposable PostgreSQL 18 database
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE gsim LOGIN PASSWORD 'ci-only';"
          docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE gsim_ci OWNER gsim;"
          node -e 'const u=new URL(process.env.DATABASE_URL);if(u.hostname!=="127.0.0.1"||u.pathname!=="/gsim_ci")process.exit(1)'
          npm run db:push -- --force
      - name: Build tested code
        run: npm run build
      - name: Install pinned Playwright browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Start synthetic server
        run: |
          NODE_ENV=production node dist/index.cjs > "$RUNNER_TEMP/gsim-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/gsim-server.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser E2E
        run: npx --no-install playwright test
      - name: Stop synthetic server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/gsim-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/gsim-server.pid")" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify production dependencies and API lifecycle
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node deploy/check-runtime.mjs
      - name: Package code only
        run: tar -czf "$RUNNER_TEMP/release.tgz" dist package.json package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gsim
          path: ${{ runner.temp }}/release.tgz
          retention-days: 1
          overwrite: true
