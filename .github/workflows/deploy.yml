name: Deploy to VM (toc.tesstech.ru)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/e2e.yml
  verify-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore exact tested code
        id: restore-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release.tgz
          key: ${{ needs.test.outputs.release_key }}
          fail-on-cache-miss: true
      - name: Validate tested code digest
        env:
          EXPECTED_RELEASE_SHA256: ${{ needs.test.outputs.release_digest }}
        run: |
          test "${{ steps.restore-release.outputs.cache-hit }}" = true
          [[ "$EXPECTED_RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_RELEASE_SHA256" "$RUNNER_TEMP/release.tgz" | sha256sum -c - >/dev/null
  deploy:
    needs: [test, verify-release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-gsim
      cancel-in-progress: false
    env:
      EXPECTED_RELEASE_SHA256: ${{ needs.test.outputs.release_digest }}
      DEPLOY_HOST: ${{ secrets.VM_HOST }}
      DEPLOY_USER: ${{ secrets.VM_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject stale source revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Restore exact tested code
        id: restore-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release.tgz
          key: ${{ needs.test.outputs.release_key }}
          fail-on-cache-miss: true
      - name: Validate tested code digest
        env:
          EXPECTED_RELEASE_SHA256: ${{ needs.test.outputs.release_digest }}
        run: |
          test "${{ steps.restore-release.outputs.cache-hit }}" = true
          [[ "$EXPECTED_RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_RELEASE_SHA256" "$RUNNER_TEMP/release.tgz" | sha256sum -c - >/dev/null
      - name: Verified SSH
        env:
          DEPLOY_KEY: ${{ secrets.VM_SSH_KEY }}
        run: bash deploy/ssh-setup.sh
      - name: Publish tested artifact with rollback
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/release.tgz
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/publish.sh gsim "$RELEASE_ID"
      - name: Clear temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/tesstech-ssh/key"
