name: Deploy to VM (toc.tesstech.ru)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/e2e.yml
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-gsim
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.VM_HOST }}
      DEPLOY_USER: ${{ secrets.VM_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject stale source revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-gsim
          path: ${{ runner.temp }}/release
      - name: Verified SSH
        env:
          DEPLOY_KEY: ${{ secrets.VM_SSH_KEY }}
        run: bash deploy/ssh-setup.sh
      - name: Publish tested artifact with rollback
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/release/release.tgz
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/publish.sh gsim "$RELEASE_ID"
      - name: Clear temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/tesstech-ssh/key"
